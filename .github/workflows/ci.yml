name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npx biome ci .
      - name: Type-check (tsc)
        run: npm run build:server
      - name: Unit & integration tests (vitest)
        run: npm test
      - name: Client build (vite)
        run: npm run build:client
